  <path d="M140 145 A 80 80 0 0 1 260 145" fill="none" stroke="url(#redGoldGlow)" stroke-width="5" stroke-linecap="round"/>
  <path d="M160 170 A 55 55 0 0 1 240 170" fill="none" stroke="url(#redGoldGlow)" stroke-width="5" stroke-linecap="round"/>
  <path d="M180 195 A 30 30 0 0 1 220 195" fill="none" stroke="url(#redGoldGlow)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="200" cy="220" r="6" fill="#E6C285"/>
  
  <!-- Title Badge -->
