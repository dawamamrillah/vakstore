  </defs>
  <rect width="400" height="400" rx="32" fill="url(#telkomBg)" stroke="#382E26" stroke-width="2"/>
  <circle cx="200" cy="180" r="120" fill="url(#centerGlow)"/>
  
  <circle cx="200" cy="180" r="90" fill="#1C1814" stroke="#E6C285" stroke-width="2.5" stroke-dasharray="8 6"/>
  <circle cx="200" cy="180" r="78" fill="#261A18" stroke="#EF4444" stroke-width="1.5" stroke-opacity="0.6"/>

