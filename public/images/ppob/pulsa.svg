<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="pulsaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1915" />
      <stop offset="50%" stop-color="#2D2319" />
      <stop offset="100%" stop-color="#14100D" />
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E6C285" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#E6C285" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#pulsaBg)" stroke="#382E26" stroke-width="2"/>
  <circle cx="200" cy="180" r="120" fill="url(#centerGlow)"/>
  
  <circle cx="200" cy="180" r="90" fill="#1C1814" stroke="#E6C285" stroke-width="2.5" stroke-dasharray="8 6"/>
  <circle cx="200" cy="180" r="78" fill="#241E17" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Phone / Signal Icon -->
  <rect x="170" y="130" width="60" height="100" rx="10" fill="none" stroke="url(#goldGlow)" stroke-width="4"/>
  <circle cx="200" cy="212" r="4" fill="#E6C285"/>
  <line x1="188" y1="142" x2="212" y2="142" stroke="#E6C285" stroke-width="3" stroke-linecap="round"/>
  <!-- Signal waves -->
  <path d="M148 160 A 25 25 0 0 0 148 200" fill="none" stroke="#E6C285" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M136 148 A 45 45 0 0 0 136 212" fill="none" stroke="#E6C285" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6"/>
  <path d="M252 160 A 25 25 0 0 1 252 200" fill="none" stroke="#E6C285" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M264 148 A 45 45 0 0 1 264 212" fill="none" stroke="#E6C285" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6"/>
  
  <!-- Title Badge -->
  <rect x="50" y="300" width="300" height="48" rx="24" fill="#29221B" stroke="#E6C285" stroke-width="1.5"/>
  <text x="200" y="330" fill="#F8F6F0" font-family="sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="1.5">PULSA &amp; PAKET DATA</text>
