<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="pdamBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1915" />
      <stop offset="50%" stop-color="#1C242B" />
      <stop offset="100%" stop-color="#14100D" />
    </linearGradient>
    <linearGradient id="waterGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#E6C285" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#pdamBg)" stroke="#382E26" stroke-width="2"/>
  <circle cx="200" cy="180" r="120" fill="url(#centerGlow)"/>
  
  <circle cx="200" cy="180" r="90" fill="#1C1814" stroke="#E6C285" stroke-width="2.5" stroke-dasharray="8 6"/>
  <circle cx="200" cy="180" r="78" fill="#1E2228" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Water Drop Icon -->
  <path d="M200 120 C185 150, 160 180, 160 205 A40 40 0 0 0 240 205 C240 180, 215 150, 200 120 Z" fill="url(#waterGlow)" filter="drop-shadow(0px 4px 12px rgba(56, 189, 248, 0.4))"/>
  
  <!-- Title Badge -->
  <rect x="50" y="300" width="300" height="48" rx="24" fill="#29221B" stroke="#E6C285" stroke-width="1.5"/>
  <text x="200" y="330" fill="#F8F6F0" font-family="sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="1.5">TAGIHAN AIR PDAM</text>
