<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="plnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1915" />
      <stop offset="50%" stop-color="#2D2319" />
      <stop offset="100%" stop-color="#14100D" />
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#plnBg)" stroke="#382E26" stroke-width="2"/>
  <circle cx="200" cy="180" r="120" fill="url(#centerGlow)"/>
  
  <!-- Outer Gold Ring -->
  <circle cx="200" cy="180" r="90" fill="#1C1814" stroke="#E6C285" stroke-width="2.5" stroke-dasharray="8 6"/>
  <circle cx="200" cy="180" r="78" fill="#241E17" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Lightning Bolt Icon -->
  <path d="M210 110 L160 185 H205 L190 250 L245 170 H200 Z" fill="url(#goldGlow)" filter="drop-shadow(0px 4px 12px rgba(245, 158, 11, 0.5))"/>
  
  <!-- Title Badge -->
  <rect x="60" y="300" width="280" height="48" rx="24" fill="#29221B" stroke="#E6C285" stroke-width="1.5"/>
  <text x="200" y="330" fill="#F8F6F0" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="2">TOKEN LISTRIK PLN</text>
</svg>
